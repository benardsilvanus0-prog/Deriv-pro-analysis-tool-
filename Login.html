<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LASTDIGIT — Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #101715;
      background:
        linear-gradient(rgba(20, 35, 30, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(20, 35, 30, 0.045) 1px, transparent 1px),
        #f1f2ec;
      background-size: 48px 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-wrapper {
      width: 100%;
      max-width: 430px;
    }

    /* BRAND */
    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-icon {
      width: 68px;
      height: 68px;
      margin: 0 auto 14px;
      border-radius: 50%;
      background: #101715;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 25px rgba(0,0,0,0.12);
    }

    .brand-icon::before {
      content: "";
      width: 34px;
      height: 34px;
      border: 2px solid #f1f2ec;
      border-radius: 50%;
      display: block;
    }

    .brand-icon::after {
      content: "";
      position: absolute;
      width: 9px;
      height: 9px;
      background: #f1f2ec;
      border-radius: 50%;
    }

    .brand h1 {
      font-size: 22px;
      font-weight: 500;
      letter-spacing: 5px;
    }

    .brand p {
      margin-top: 8px;
      font-size: 11px;
      letter-spacing: 2px;
      color: #7d8580;
      text-transform: uppercase;
    }

    /* CARD */
    .login-card {
      background: rgba(249, 250, 246, 0.94);
      border: 1px solid rgba(20, 35, 30, 0.10);
      border-radius: 24px;
      padding: 32px 28px;
      box-shadow: 0 12px 35px rgba(20, 35, 30, 0.08);
    }

    .section-label {
      color: #858c87;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 9px;
    }

    .login-card h2 {
      font-size: 28px;
      font-weight: 500;
      margin-bottom: 7px;
    }

    .description {
      color: #747b76;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    /* FORM */
    .field {
      margin-bottom: 19px;
    }

    label {
      display: block;
      font-size: 12px;
      color: #737a75;
      letter-spacing: 1px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .input-box {
      position: relative;
    }

    input {
      width: 100%;
      height: 54px;
      border: 1px solid #d7dbd4;
      border-radius: 14px;
      background: #f8f9f5;
      color: #101715;
      padding: 0 16px;
      font-size: 15px;
      outline: none;
      transition: 0.2s;
    }

    input:focus {
      border-color: #0b6658;
      box-shadow: 0 0 0 3px rgba(11, 102, 88, 0.08);
    }

    input::placeholder {
      color: #a4aaa5;
    }

    .password-toggle {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: #7c837e;
      cursor: pointer;
      font-size: 12px;
    }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 5px 2px 23px;
      font-size: 12px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #747b76;
    }

    .remember input {
      width: 15px;
      height: 15px;
      accent-color: #0b6658;
    }

    .forgot {
      color: #0b6658;
      text-decoration: none;
    }

    /* LOGIN BUTTON */
    .login-btn {
      width: 100%;
      height: 56px;
      border: none;
      border-radius: 16px;
      background: #0b6658;
      color: white;
      font-size: 15px;
      letter-spacing: 1px;
      cursor: pointer;
      transition: 0.2s;
    }

    .login-btn:hover {
      background: #095748;
      transform: translateY(-1px);
    }

    .login-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    /* STATUS */
    .message {
      display: none;
      margin-top: 17px;
      padding: 13px 15px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.4;
    }

    .message.error {
      display: block;
      background: #f4d7d1;
      color: #8d4439;
      border: 1px solid #e8bbb2;
    }

    .message.success {
      display: block;
      background: #dceee8;
      color: #176454;
      border: 1px solid #c2ded5;
    }

    .divider {
      height: 1px;
      background: #e1e4df;
      margin: 27px 0 21px;
    }

    .footer-text {
      text-align: center;
      color: #858b87;
      font-size: 12px;
      line-height: 1.6;
    }

    .secure {
      margin-top: 18px;
      text-align: center;
      color: #9a9f9b;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    /* MOBILE */
    @media (max-width: 480px) {
      body {
        padding: 18px;
      }

      .login-card {
        padding: 27px 21px;
        border-radius: 22px;
      }

      .brand h1 {
        font-size: 20px;
      }

      .login-card h2 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <main class="login-wrapper">

    <div class="brand">
      <div class="brand-icon"></div>
      <h1>LASTDIGIT</h1>
      <p>Trading Analysis Platform</p>
    </div>

    <section class="login-card">

      <div class="section-label">Secure Access</div>

      <h2>Welcome back</h2>

      <p class="description">
        Sign in to access your market analysis dashboard.
      </p>

      <form id="loginForm">

        <div class="field">
          <label for="email">Email</label>

          <div class="input-box">
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Enter your email"
              autocomplete="email"
              required
            >
          </div>
        </div>

        <div class="field">
          <label for="password">Password</label>

          <div class="input-box">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              class="password-toggle"
              id="togglePassword"
            >
              SHOW
            </button>
          </div>
        </div>

        <div class="options">

          <label class="remember">
            <input type="checkbox" id="remember">
            Remember me
          </label>

          <a href="#" class="forgot" id="forgotPassword">
            Forgot password?
          </a>

        </div>

        <button type="submit" class="login-btn" id="loginBtn">
          LOGIN
        </button>

        <div id="message" class="message"></div>

      </form>

      <div class="divider"></div>

      <p class="footer-text">
        Your account gives you access to the<br>
        LASTDIGIT analysis dashboard.
      </p>

      <div class="secure">
        ● Secure account access
      </div>

    </section>

  </main>

  <script>
    const form = document.getElementById("loginForm");
    const password = document.getElementById("password");
    const togglePassword = document.getElementById("togglePassword");
    const loginBtn = document.getElementById("loginBtn");
    const message = document.getElementById("message");

    togglePassword.addEventListener("click", () => {
      if (password.type === "password") {
        password.type = "text";
        togglePassword.textContent = "HIDE";
      } else {
        password.type = "password";
        togglePassword.textContent = "SHOW";
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const passwordValue = password.value;

      message.className = "message";
      message.textContent = "";

      loginBtn.disabled = true;
      loginBtn.textContent = "SIGNING IN...";

      try {
        const response = await fetch("/.netlify/functions/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            email,
            password: passwordValue
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || "Login failed.");
        }

        message.className = "message success";
        message.textContent = "Login successful. Opening dashboard...";

        setTimeout(() => {
          window.location.href = "/index.html";
        }, 700);

      } catch (error) {
        message.className = "message error";
        message.textContent = error.message || "Unable to sign in.";
      }

      loginBtn.disabled = false;
      loginBtn.textContent = "LOGIN";
    });

    document.getElementById("forgotPassword").addEventListener("click", (event) => {
      event.preventDefault();

      message.className = "message";
      message.textContent =
        "Password recovery will be available once the account system is configured.";
      message.style.display = "block";
    });
  </script>

</body>
</html>
