<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0">

<meta name="theme-color" content="#ffffff">

<title>Expert Trader — Login</title>

<style>
:root{
  --bg:#f7f9ff;
  --card:#fff;
  --text:#17234a;
  --muted:#7180a3;
  --purple:#4037df;
  --pink:#ed2c91;
  --red:#ff3d5a;
  --line:#dfe5ff;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;

  font-family:Inter,Arial,sans-serif;

  background:
    radial-gradient(
      circle at top,
      #eef1ff,
      #f7f9ff 55%,
      #ffffff
    );

  color:var(--text);
}

.login-card{
  width:min(420px,100%);
  padding:32px;

  background:var(--card);

  border:1px solid var(--line);
  border-radius:22px;

  box-shadow:
    0 20px 60px
    rgba(60,70,160,.16);
}

.logo{
  text-align:center;
  font-size:31px;
  font-weight:900;
  color:var(--pink);
}

.line{
  width:150px;
  height:3px;
  margin:7px auto 0;

  border-radius:10px;

  background:
    linear-gradient(
      90deg,
      #ed2c91,
      #6d2be8
    );
}

.subtitle{
  margin:13px 0 28px;

  text-align:center;

  color:var(--muted);
  font-size:13px;
}

.field{
  margin-bottom:18px;
}

.field label{
  display:block;
  margin-bottom:7px;

  font-size:12px;
  font-weight:800;
  color:#526083;
}

.field input{
  width:100%;
  height:47px;

  padding:0 13px;

  border:1px solid #cfd7ff;
  border-radius:10px;

  outline:none;

  font-size:14px;
}

.field input:focus{
  border-color:var(--purple);

  box-shadow:
    0 0 0 3px
    rgba(64,55,223,.12);
}

.login-button{
  width:100%;
  height:47px;

  border:0;
  border-radius:10px;

  color:white;

  font-weight:900;

  background:
    linear-gradient(
      135deg,
      #4037df,
      #6834d7
    );

  box-shadow:
    0 8px 18px
    rgba(67,55,220,.25);
}

.login-button:disabled{
  opacity:.65;
  cursor:not-allowed;
}

.error{
  min-height:20px;

  margin-top:13px;

  text-align:center;

  color:var(--red);

  font-size:12px;
  font-weight:800;
}

.info{
  margin-top:22px;
  padding:11px;

  border-radius:9px;

  background:#f5f6ff;

  color:var(--muted);

  text-align:center;

  font-size:10px;
}

.loading{
  display:none;

  margin-top:10px;

  text-align:center;

  color:var(--muted);

  font-size:11px;
}
</style>
</head>

<body>

<div class="login-card">

  <div class="logo">
    Expert Trader
  </div>

  <div class="line"></div>

  <div class="subtitle">
    Deriv Analysis Dashboard
  </div>

  <form id="loginForm">

    <div class="field">

      <label for="username">
        Username
      </label>

      <input
        id="username"
        type="text"
        autocomplete="username"
        placeholder="Enter your username"
        required
      >

    </div>

    <div class="field">

      <label for="password">
        Password
      </label>

      <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="Enter your password"
        required
      >

    </div>

    <button
      id="loginButton"
      class="login-button"
      type="submit"
    >
      🔐 Login
    </button>

    <div
      id="loading"
      class="loading">
      Signing in...
    </div>

    <div
      id="error"
      class="error">
    </div>

  </form>

  <div class="info">
    Authorized users only • Analysis only
  </div>

</div>

<script>
"use strict";

const form =
  document.getElementById("loginForm");

const username =
  document.getElementById("username");

const password =
  document.getElementById("password");

const button =
  document.getElementById("loginButton");

const error =
  document.getElementById("error");

const loading =
  document.getElementById("loading");


/* Check whether the user is
   already logged in. */

async function checkExistingSession(){

  try{

    const response =
      await fetch(
        "/.netlify/functions/session",
        {
          credentials:"include"
        }
      );

    const data =
      await response.json();

    if(
      response.ok &&
      data.authenticated
    ){

      window.location.href =
        "/index.html";

    }

  }catch(e){

    console.log(
      "Session check failed"
    );

  }
}


form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    error.textContent = "";

    button.disabled = true;

    loading.style.display =
      "block";

    try{

      const response =
        await fetch(
          "/.netlify/functions/login",
          {
            method:"POST",

            headers:{
              "Content-Type":
                "application/json"
            },

            credentials:"include",

            body:JSON.stringify({

              username:
                username.value.trim(),

              password:
                password.value

            })
          }
        );

      const data =
        await response.json();

      if(!response.ok){

        throw new Error(
          data.message ||
          "Login failed."
        );

      }

      window.location.href =
        "/index.html";

    }catch(e){

      error.textContent =
        e.message ||
        "Unable to login.";

    }finally{

      button.disabled = false;

      loading.style.display =
        "none";

    }

  }
);


checkExistingSession();
</script>

</body>
      </html>
