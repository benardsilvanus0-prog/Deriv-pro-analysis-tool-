const CONFIG = {

    maxTicks: 5000,

    minimumConfidence: 65,

    maximumConfidence: 95,

let ws = null;

/* =========================================================
   DOM
========================================================= */

function $(id){

    return document.getElementById(id);

/* =========================================================
   TOAST
========================================================= */

function toast(message){

    $("toast").textContent = message;

    $("toast").style.display = "block";

function showModal(title,body){

}


/* =========================================================
   NUMERIC HELPERS
========================================================= */

function clamp(value,min,max){

    return Math.max(
        min,
        Math.min(max,value)
    );

}


function mean(values){

    if(!values.length){

        return 0;

    }

    return values.reduce(
        (a,b)=>a+b,
        0
    ) / values.length;

}


function standardDeviation(values){

    if(values.length < 2){

        return 0;

    }

    const m = mean(values);

    const variance =
        mean(
            values.map(
                x => Math.pow(x-m,2)
            )
        );

    return Math.sqrt(variance);

}


/* =========================================================
   DECIMAL PLACES
========================================================= */

function decimalPlaces(value){

    value = Number(value);

    if(!Number.isFinite(value) || value <= 0){

        return 2;

    }

    if(value >= 1){

        return 0;

    }

    return Math.max(
        0,
        Math.round(
            -Math.log10(value)
        )
    );

}


/* =========================================================
   LAST DIGIT
========================================================= */

function getLastDigit(price){

    const places =
        decimalPlaces(pip);

    const fixed =
        Number(price)
            .toFixed(places);

    const digits =
        fixed.replace(/\D/g,"");

    if(!digits){

        return null;

    }

    return Number(
        digits[digits.length-1]
    );

}


/* =========================================================
   NORMALIZE TICK
========================================================= */

function createTick(price,epoch){

    const numericPrice =
        Number(price);

    if(!Number.isFinite(numericPrice)){

        return null;

    }

    const digit =
        getLastDigit(numericPrice);

    if(
        digit === null ||
        digit < 0 ||
        digit > 9
    ){

        return null;

    }

    return {

        price:numericPrice,

        digit:digit,

        epoch:
            epoch === undefined
            ? null
            : epoch

    };

}


/* =========================================================
   ANALYSIS DATA
========================================================= */

function getAnalysisTicks(){

    const requested =
        Number(
            $("analysisTicks").value
        ) || 1000;

    return ticks.slice(
        -requested
    );

}


/* =========================================================
   DIGIT COUNTS
========================================================= */

function getDigitCounts(data){

    const counts =
        Array(10).fill(0);

    data.forEach(
        item => {

            if(
                item &&
                Number.isInteger(item.digit)
            ){

                counts[item.digit]++;

            }

        }
    );

    return counts;

}


/* =========================================================
   DIGIT PROBABILITIES
========================================================= */

function getDigitProbabilities(data){

    const counts =
        getDigitCounts(data);

    const total =
        data.length;

    if(!total){

        return Array(10).fill(10);

    }

    /*
       Laplace/Bayesian smoothing.
       Prevents tiny samples from producing
       absurd 0% or 100% probabilities.
    */

    const alpha = 1;

    const denominator =
        total + alpha*10;

    return counts.map(
        count =>
            (count+alpha) /
            denominator *
            100
    );

}


/* =========================================================
   BASELINE
========================================================= */

function baselineFor(type,digit,barrier){

    switch(type){

        case "OVER":

            return (
                clamp(
                    9-barrier,
                    0,
                    10
                ) * 10
            );


        case "UNDER":

            return (
                clamp(
                    barrier,
                    0,
                    10
                ) * 10
            );


        case "EVEN":

            return 50;


        case "ODD":

            return 50;


        case "MATCH":

            return 10;


        case "DIFF":

            return 90;


        default:

            return 50;

    }

}


/* =========================================================
   CONDITION TEST
========================================================= */

function isWin(digit,type,barrier,target){

    switch(type){

        case "OVER":
            return digit > barrier;

        case "UNDER":
            return digit < barrier;

        case "EVEN":
            return digit % 2 === 0;

        case "ODD":
            return digit % 2 !== 0;

        case "MATCH":
            return digit === target;

        case "DIFF":
            return digit !== target;

        default:
            return false;

    }

}


/* =========================================================
   HORIZON OUTCOMES
=========================================================

   This is one of the most important improvements.

   If duration = 100:

   entry tick i
          ↓
   100 ticks
          ↓
   outcome tick i + 100

========================================================= */

function buildHorizonSamples(data,horizon){

    horizon =
        Math.max(
            1,
            Number(horizon) || 1
        );

    const result = [];

    const max =
        data.length-horizon;

    for(
        let i=0;
        i<max;
        i++
    ){

        const entry =
            data[i];

        const outcome =
            data[i+horizon];

        if(
            !entry ||
            !outcome
        ){

            continue;

        }

        result.push({

            entryDigit:entry.digit,

            outcomeDigit:outcome.digit,

            entryIndex:i,

            outcomeIndex:i+horizon

        });

    }

    return result;

}


/* =========================================================
   CONDITION SAMPLES
========================================================= */

function getConditionSamples(
    data,
    horizon,
    type,
    barrier,
    target
){

    const horizonData =
        buildHorizonSamples(
            data,
            horizon
        );

    return horizonData.map(
        sample => {

            return {

                ...sample,

                win:isWin(
                    sample.outcomeDigit,
                    type,
                    barrier,
                    target
                )

            };

        }
    );

}


/* =========================================================
   WILSON LOWER CONFIDENCE
========================================================= */

function wilsonLower(
    wins,
    total,
    z=1.96
){

    if(!total){

        return 0;

    }

    const p =
        wins/total;

    const denominator =
        1 +
        (z*z)/total;

    const centre =
        p +
        (z*z)/(2*total);

    const adjustment =
        z *
        Math.sqrt(
            (
                p*(1-p) +
                (z*z)/(4*total)
            ) / total
        );

    return (
        centre-adjustment
    ) / denominator * 100;

}


/* =========================================================
   BINOMIAL Z-SCORE
========================================================= */

function binomialZ(
    wins,
    total,
    expectedPercent
){

    if(!total){

        return 0;

    }

    const p0 =
        expectedPercent/100;

    const observed =
        wins/total;

    const standardError =
        Math.sqrt(
            Math.max(
                1e-9,
                p0*(1-p0)/total
            )
        );

    return (
        observed-p0
    ) / standardError;

}


/* =========================================================
   CONDITION RATE
========================================================= */

function conditionRate(samples){

    if(!samples.length){

        return 0;

    }

    return (
        samples.filter(
            x => x.win
        ).length /
        samples.length
    ) * 100;

}


/* =========================================================
   MULTI WINDOW ANALYSIS
========================================================= */

function analyzeWindows(
    samples,
    type,
    barrier,
    target
){

    const expected =
        baselineFor(
            type,
            target,
            barrier
        );

    const available =
        samples.length;

    const results = [];

    const usableWindows =
        CONFIG.windows
            .filter(
                w =>
                    w <= available
            );

    usableWindows.forEach(
        windowSize => {

            const subset =
                samples.slice(
                    -windowSize
                );

            const wins =
                subset.filter(
                    x => x.win
                ).length;

            const rate =
                conditionRate(
                    subset
                );

            const edge =
                rate-expected;

            const z =
                binomialZ(
                    wins,
                    subset.length,
                    expected
                );

            const lower =
                wilsonLower(
                    wins,
                    subset.length
                );

            results.push({

                window:windowSize,

                total:subset.length,

                wins:wins,

                rate:rate,

                edge:edge,

                z:z,

                lower:lower

            });

        }
    );

    return results;

}


/* =========================================================
   CONSISTENCY
========================================================= */

function consistencyScore(
    windows,
    expected
){

    if(windows.length < 2){

        return 0;

    }

    const edges =
        windows.map(
            x => x.edge
        );

    const positive =
        edges.filter(
            x => x > 0
        ).length;

    const agreement =
        positive /
        edges.length *
        100;

    const spread =
        standardDeviation(
            edges
        );

    const stability =
        clamp(
            100 -
            spread*8,
            0,
            100
        );

    return (
        agreement*.65 +
        stability*.35
    );

}


/* =========================================================
   AGREEMENT
========================================================= */

function agreementScore(windows){

    if(!windows.length){

        return 0;

    }

    const direction =
        windows.filter(
            x => x.edge > 0
        ).length;

    return (
        direction /
        windows.length *
        100
    );

}


/* =========================================================
   ENTROPY
========================================================= */

function entropyScore(data){

    if(!data.length){

        return 0;

    }

    const probabilities =
        getDigitProbabilities(data)
            .map(
                p => p/100
            );

    let entropy = 0;

    probabilities.forEach(
        p => {

            if(p > 0){

                entropy -=
                    p*Math.log2(p);

            }

        }
    );

    /*
       Maximum entropy for 10 digits = log2(10).
       Higher entropy = more random.
    */

    return (
        entropy/
        Math.log2(10) *
        100
    );

}


/* =========================================================
   TRANSITION ANALYSIS
========================================================= */

function transitionSignal(
    data,
    type,
    barrier,
    target
){

    if(data.length < 20){

        return 0;

    }

    const recent =
        data.slice(-100);

    let opportunities = 0;

    let wins = 0;

    for(
        let i=0;
        i<recent.length-1;
        i++
    ){

        const current =
            recent[i].digit;

        const next =
            recent[i+1].digit;

        if(
            type === "MATCH" &&
            current === target
        ){

            opportunities++;

            if(next === target){

                wins++;

            }

        }

        else if(
            type === "DIFF" &&
            current === target
        ){

            opportunities++;

            if(next !== target){

                wins++;

            }

        }

        else if(
            type === "OVER" &&
            current > barrier
        ){

            opportunities++;

            if(next > barrier){

                wins++;

            }

        }

        else if(
            type === "UNDER" &&
            current < barrier
        ){

            opportunities++;

            if(next < barrier){

                wins++;

            }

        }

    }

    if(opportunities < 5){

        return 0;

    }

    return (
        wins/opportunities*100
    );

}


/* =========================================================
   FIND BEST DIGIT
========================================================= */

function findBestDigit(data,horizon,type){

    const probabilities =
        Array(10).fill(0);

    for(let d=0;d<10;d++){

        const samples =
            getConditionSamples(
                data,
                horizon,
                "MATCH",
                barrierValue,
                d
            );

        probabilities[d] =
            conditionRate(
                samples
            );

    }

    if(type === "MATCH"){

        let best = 0;

        for(let d=1;d<10;d++){

            if(
                probabilities[d] >
                probabilities[best]
            ){

                best = d;

            }

        }

        return {

            digit:best,

            probability:
                probabilities[best]

        };

    }


    if(type === "DIFF"){

        let best = 0;

        for(let d=1;d<10;d++){

            if(
                probabilities[d] <
                probabilities[best]
            ){

                best = d;

            }

        }

        return {

            digit:best,

            probability:
                100 -
                probabilities[best]

        };

    }

    return {

        digit:
            probabilities.indexOf(
                Math.max(
                    ...probabilities
                )
            ),

        probability:
            Math.max(
                ...probabilities
            )

    };

}


/* =========================================================
   WALK-FORWARD VALIDATION
=========================================================

   Instead of only asking:

   "What happened recently?"

   we also ask:

   "When this type of signal appeared historically,
    how often did it actually work?"

========================================================= */

function walkForwardValidation(
    data,
    horizon,
    type,
    barrier,
    target
){

    const minimumTraining = 50;

    if(
        data.length <
        minimumTraining+horizon+20
    ){

        return {

            score:50,

            samples:0,

            wins:0,

            rate:0

        };

    }

    const start =
        minimumTraining;

    const end =
        data.length-horizon;

    const step =
        Math.max(
            1,
            Math.floor(
                (end-start) /
                CONFIG.validationSamples
            )
        );

    let samples = 0;

    let wins = 0;

    for(
        let i=start;
        i<end;
        i+=step
    ){

        const training =
            data.slice(
                0,
                i
            );

        const horizonSamples =
            getConditionSamples(
                training,
                horizon,
                type,
                barrier,
                target
            );

        if(
            horizonSamples.length <
            minimumTraining
        ){

            continue;

        }

        const windows =
            analyzeWindows(
                horizonSamples,
                type,
                barrier,
                target
            );

        if(!windows.length){

            continue;

        }

        const latest =
            windows[
                windows.length-1
            ];

        /*
           Only validate when the historical
           model would have considered the
           signal direction positive.
        */

        if(
            latest.edge <
            CONFIG.minimumEdge
        ){

            continue;

        }

        const actual =
            data[i+horizon];

        if(!actual){

            continue;

        }

        samples++;

        if(
            isWin(
                actual.digit,
                type,
                barrier,
                target
            )
        ){

            wins++;

        }

    }

    if(!samples){

        return {

            score:50,

            samples:0,

            wins:0,

            rate:0

        };

    }

    const rate =
        wins/samples*100;

    /*
       Validation score is relative to
       the theoretical baseline.
    */

    const expected =
        baselineFor(
            type,
            target,
            barrier
        );

    const edge =
        rate-expected;

    const score =
        clamp(
            50 +
            edge*3,
            0,
            100
        );

    return {

        score:score,

        samples:samples,

        wins:wins,

        rate:rate,

        edge:edge

    };

}


/* =========================================================
   FINAL CONFIDENCE ENGINE
========================================================= */

function calculateProfessionalAnalysis(){

    const data =
        getAnalysisTicks();

    const duration =
        Number(
            $("duration").value
        ) || 100;

    if(
        data.length <
        CONFIG.minimumTicks
    ){

        return {

            ready:false,

            confidence:0,

            reason:
                "Waiting for more tick data."

        };

    }

    let target =
        selectedDigit;


    /*
       Automatically optimize MATCH/DIFFERS
       target digit.
    */

    if(
        currentContract === "MATCH" ||
        currentContract === "DIFF"
    ){

        const best =
            findBestDigit(
                data,
                duration,
                currentContract
            );

        target =
            best.digit;

        selectedDigit =
            target;

    }


    const samples =
        getConditionSamples(
            data,
            duration,
            currentContract,
            barrierValue,
            target
        );

    if(
        samples.length <
        CONFIG.minimumTicks/2
    ){

        return {

            ready:false,

            confidence:0,

            reason:
                "Not enough completed duration samples."

        };

    }


    const expected =
        baselineFor(
            currentContract,
            target,
            barrierValue
        );


    const windows =
        analyzeWindows(
            samples,
            currentContract,
            barrierValue,
            target
        );


    if(!windows.length){

        return {

            ready:false,

            confidence:0,

            reason:
                "No valid analysis windows."

        };

    }


    const latest =
        windows[
            windows.length-1
        ];


    const longTerm =
        windows[0];


    const recent =
        windows[
            windows.length-1
        ];


    const consistency =
        consistencyScore(
            windows,
            expected
        );


    const agreement =
        agreementScore(
            windows
        );


    const validation =
        walkForwardValidation(
            data,
            duration,
            currentContract,
            barrierValue,
            target
        );


    const transition =
        transitionSignal(
            data,
            currentContract,
            barrierValue,
            target
        );


    const entropy =
        entropyScore(
            data
        );


    const recencyEdge =
        recent.edge;


    const longEdge =
        longTerm.edge;


    const z =
        latest.z;


    const statisticalEvidence =
        clamp(
            50 +
            z*9,
            0,
            100
        );


    const edgeScore =
        clamp(
            50 +
            recencyEdge*4,
            0,
            100
        );


    const validationScore =
        validation.samples
        ? validation.score
        : 50;


    const recencyScore =
        clamp(
            50 +
            recencyEdge*5,
            0,
            100
        );


    /*
       Randomness penalty.

       We don't reject high entropy by itself,
       because synthetic digit streams can remain
       highly random even when a small statistical
       edge appears.

       We only penalize if there is almost no
       statistical separation.
    */

    let randomnessPenalty = 0;

    if(
        entropy > 99 &&
        Math.abs(recencyEdge) < 1
    ){

        randomnessPenalty = 12;

    }


    /*
       Ensemble score.
    */

    let confidence =
        statisticalEvidence*.24 +
        edgeScore*.22 +
        consistency*.16 +
        agreement*.12 +
        validationScore*.16 +
        recencyScore*.10;


    confidence -=
        randomnessPenalty;


    /*
       Small transition confirmation.
    */

    if(
        transition > expected
    ){

        confidence += 3;

    }


    confidence =
        clamp(
            confidence,
            0,
            CONFIG.maximumConfidence
        );


    /*
       Strict signal filters.
    */

    const positiveEdge =
        latest.edge >=
        CONFIG.minimumEdge;


    const statisticallySignificant =
        latest.z >=
        CONFIG.minimumZScore;


    const consistent =
        consistency >=
        CONFIG.minimumConsistency;


    const agreed =
        agreement >=
        CONFIG.minimumAgreement;


    const validated =
        validation.samples < 10 ||
        validation.edge >= 0;


    const minimum =
        Number(
            $("threshold").value
        ) || CONFIG.minimumConfidence;


    const signal =
        samples.length >= CONFIG.minimumTicks/2 &&
        confidence >= minimum &&
        positiveEdge &&
        statisticallySignificant &&
        consistent &&
        agreed &&
        validated;


    return {

        ready:true,

        signal:signal,

        confidence:confidence,

        target:target,

        expected:expected,

        observed:latest.rate,

        edge:latest.edge,

        z:z,

        consistency:consistency,

        agreement:agreement,

        validation:validation,

        transition:transition,

        entropy:entropy,

        windows:windows,

        samples:samples.length,

        duration:duration,

        label:getSignalLabel(
            currentContract,
            target,
            barrierValue
        )

    };

}


/* =========================================================
   LABEL
========================================================= */

function getSignalLabel(
    type,
    target,
    barrier
){

    switch(type){

        case "OVER":
            return "OVER " + barrier;

        case "UNDER":
            return "UNDER " + barrier;

        case "MATCH":
            return "MATCH " + target;

        case "DIFF":
            return "DIFFERS " + target;

        case "EVEN":
            return "EVEN";

        case "ODD":
            return "ODD";

        default:
            return type;

    }

}


/* =========================================================
   MAIN ANALYSIS
========================================================= */

function analyze(){

    clearTimeout(
        analysisTimer
    );

    analysisTimer =
        setTimeout(
            performAnalysis,
            CONFIG.liveAnalysisDelay
        );

}


function performAnalysis(){

    const data =
        getAnalysisTicks();

    const requested =
        Number(
            $("analysisTicks").value
        ) || 1000;


    const required =
        Math.max(
            requested,
            100
        );


    const dataPercent =
        clamp(
            ticks.length /
            required *
            100,
            0,
            100
        );


    $("dataBar").style.width =
        dataPercent + "%";


    $("statusBar").style.width =
        dataPercent + "%";


    $("tickStatus").textContent =
        ticks.length +
        " ticks";


    $("lastDigit").textContent =
        data.length
        ? data[data.length-1].digit
        : "-";


    if(!data.length){

        resetAnalysisDisplay();

        drawCharts();

        return;

    }


    const result =
        calculateProfessionalAnalysis();


    lastAnalysis =
        result;


    if(!result.ready){

        $("analysisStatus").textContent =
            analyzing
            ? "Collecting data"
            : "Waiting";


        $("confidence").textContent =
            "0%";


        $("confidenceBar").style.width =
            "0%";


        $("entry").textContent =
            "NO SIGNAL • " +
            result.reason;


        $("message").textContent =
            result.reason;


        drawCharts();

        return;

    }


    /*
       Update selected digit.
    */

    if(
        currentContract === "MATCH" ||
        currentContract === "DIFF"
    ){

        selectedDigit =
            result.target;

    }


    $("bestDigit").textContent =
        selectedDigit;


    $("bestStatus").textContent =
        selectedDigit;


    $("modeStatus").textContent =
        result.label;


    const confidence =
        Math.round(
            result.confidence
        );


    $("confidence").textContent =
        confidence + "%";


    $("confidenceBar").style.width =
        confidence + "%";


    $("statusBar").style.width =
        dataPercent + "%";


    $("analysisStatus").textContent =
        analyzing
        ? "Live Analysis"
        : "Ready";


    /*
       Pattern status.
    */

    if(
        result.edge >= 5
    ){

        $("patternStatus").textContent =
            "Strong positive bias";

    }

    else if(
        result.edge >= 2
    ){

        $("patternStatus").textContent =
            "Positive bias";

    }

    else if(
        result.edge <= -2
    ){

        $("patternStatus").textContent =
            "Below baseline";

    }

    else{

        $("patternStatus").textContent =
            "Neutral";

    }


    /*
       Detailed message.
    */

    $("message").textContent =
        result.label +
        " • " +
        result.observed.toFixed(2) +
        "% observed vs " +
        result.expected.toFixed(2) +
        "% baseline • Edge " +
        (result.edge >= 0 ? "+" : "") +
        result.edge.toFixed(2) +
        " pp • Z " +
        result.z.toFixed(2) +
        " • Consistency " +
        result.consistency.toFixed(0) +
        "% • Validation " +
        (
            result.validation.samples
            ? result.validation.rate.toFixed(1)+"%"
            : "N/A"
        );


    /*
       ENTRY DECISION
    */

    if(result.signal){

        $("entry").textContent =
            "SIGNAL • " +
            result.label +
            " • Evidence " +
            confidence +
            "% • " +
            result.samples +
            " completed samples";

    }

    else{

        $("entry").textContent =
            "NO TRADE • Evidence is not strong enough. " +
            "Wait for confirmation.";

    }


    drawCharts();

}

/* =========================================================
   CANVAS
========================================================= */

function resizeCanvas(canvas){

    const rect =
        canvas.getBoundingClientRect();

    const ratio =
        window.devicePixelRatio || 1;

    canvas.width =
        Math.max(
            1,
            rect.width*ratio
        );

    canvas.height =
        Math.max(
            1,
            rect.height*ratio
        );

    const ctx =
        canvas.getContext("2d");

    ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );

    return [
        ctx,
        rect.width,
        rect.height
    ];

}


/* =========================================================
   CHARTS
========================================================= */

function drawCharts(){

    const data =
        getAnalysisTicks();


    /*
       FREQUENCY
    */

    const canvas =
        $("frequency");

    const [
        ctx,
        width,
        height
    ] =
        resizeCanvas(
            canvas
        );


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    const counts =
        getDigitCounts(data);


    const max =
        Math.max(
            1,
            ...counts
        );


    const slot =
        width/10;

    const barWidth =
        slot*.55;


    for(
        let d=0;
        d<10;
        d++
    ){

        const percentage =
            data.length
            ? counts[d] /
              data.length *
              100
            : 0;


        const barHeight =
            counts[d] /
            max *
            (height-45);


        const x =
            d*slot +
            (slot-barWidth)/2;


        const y =
            height-28-barHeight;


        const gradient =
            ctx.createLinearGradient(
                0,
                y,
                0,
                height
            );


        gradient.addColorStop(
            0,
            "#18bfe8"
        );


        gradient.addColorStop(
            1,
            "#4a18c8"
        );


        ctx.fillStyle =
            gradient;


        ctx.fillRect(
            x,
            y,
            barWidth,
            barHeight
        );


        ctx.fillStyle =
            "#667085";


        ctx.font =
            "10px system-ui";


        ctx.textAlign =
            "center";


        ctx.fillText(
            d,
            x+barWidth/2,
            height-8
        );


        ctx.fillText(
            percentage.toFixed(1)+"%",
            x+barWidth/2,
            Math.max(
                12,
                y-5
            )
        );

    }


    /*
       PATTERN
    */

    const pc =
        $("pattern");

    const [
        pctx,
        pw,
        ph
    ] =
        resizeCanvas(
            pc
        );


    pctx.clearRect(
        0,
        0,
        pw,
        ph
    );


    const recent =
        data.slice(-60);


    if(!recent.length){

        return;

    }


    /*
       Grid
    */

    pctx.strokeStyle =
        "#e9edff";

    pctx.lineWidth =
        1;


    for(
        let y=20;
        y<ph;
        y+=25
    ){

        pctx.beginPath();

        pctx.moveTo(
            0,
            y
        );

        pctx.lineTo(
            pw,
            y
        );

        pctx.stroke();

    }


    /*
       Digit path
    */

    const step =
        recent.length > 1
        ? pw/(recent.length-1)
        : pw;


    pctx.strokeStyle =
        "#4a18c8";

    pctx.lineWidth =
        2;

    pctx.beginPath();


    recent.forEach(
        (item,index) => {

            const x =
                index*step;

            const y =
                ph-
                15-
                (
                    item.digit/9 *
                    (ph-30)
                );


            if(index === 0){

                pctx.moveTo(
                    x,
                    y
                );

            }

            else{

                pctx.lineTo(
                    x,
                    y
                );

            }

        }
    );


    pctx.stroke();


    /*
       Points
    */

    recent.forEach(
        (item,index) => {

            const x =
                index*step;

            const y =
                ph-
                15-
                (
                    item.digit/9 *
                    (ph-30)
                );


            pctx.fillStyle =
                item.digit % 2
                ? "#4a18c8"
                : "#08a978";


            pctx.beginPath();

            pctx.arc(
                x,
                y,
                4,
                0,
                Math.PI*2
            );

            pctx.fill();

        }
    );

}


/* =========================================================
   WEBSOCKET SEND
========================================================= */

function send(data){

    if(
        !ws ||
        ws.readyState !==
        WebSocket.OPEN
    ){

        return false;

    }

    try{

        ws.send(
            JSON.stringify(data)
        );

        return true;

    }

    catch(error){

        console.error(
            "WebSocket send error:",
            error
        );

        return false;

    }

}


/* =========================================================
   CONNECTION STATUS
========================================================= */

function setConnectionStatus(text){

    $("connection").textContent =
        text;

}


/* =========================================================
   CONNECT
========================================================= */

function connect(){

    manualDisconnect =
        false;


    if(
        ws &&
        ws.readyState ===
        WebSocket.OPEN
    ){

        return;

    }


    if(
        ws &&
        (
            ws.readyState ===
            WebSocket.CONNECTING
        )
    ){

        return;

    }


    setConnectionStatus(
        "Connecting to Deriv..."
    );


    $("market").innerHTML =
        '<option value="">Connecting...</option>';


    try{

        ws =
            new WebSocket(
                DERIV_WS
            );

    }

    catch(error){

        setConnectionStatus(
            "Connection failed"
        );

        scheduleReconnect();

        return;

    }


    ws.onopen =
        function(){

            connected =
                true;


            setConnectionStatus(
                "Connected • Public Market Data"
            );


            $("connector").textContent =
                "Disconnect";


            $("connector").className =
                "btn red";


            toast(
                "Connected to Deriv"
            );


            /*
               Current API:
               do NOT send product_type.
            */

            send({

                active_symbols:
                    "brief",

                req_id:
                    requestId++

            });

        };


    ws.onmessage =
        function(event){

            let message;


            try{

                message =
                    JSON.parse(
                        event.data
                    );

            }

            catch(error){

                console.error(
                    "Invalid Deriv message",
                    error
                );

                return;

            }


            handleDerivMessage(
                message
            );

        };


    ws.onerror =
        function(error){

            console.error(
                "Deriv WebSocket error",
                error
            );

            setConnectionStatus(
                "WebSocket error"
            );

        };


    ws.onclose =
        function(){

            connected =
                false;

            subscriptionId =
                null;


            setConnectionStatus(
                "Disconnected"
            );


            $("connector").textContent =
                "Deriv Connector";


            $("connector").className =
                "btn green";


            if(!manualDisconnect){

                scheduleReconnect();

            }

        };

}


/* =========================================================
   RECONNECT
========================================================= */

function scheduleReconnect(){

    clearTimeout(
        reconnectTimer
    );


    reconnectTimer =
        setTimeout(
            function(){

                if(!manualDisconnect){

                    connect();

                }

            },
            CONFIG.reconnectDelay
        );

}


/* =========================================================
   HANDLE DERIV MESSAGE
========================================================= */

function handleDerivMessage(message){

    console.log(
        "Deriv:",
        message
    );


    /*
       API ERROR
    */

    if(message.error){

        const errorMessage =
            message.error.message ||
            "Unknown Deriv API error";


        setConnectionStatus(
            "API error: " +
            errorMessage
        );


        $("message").textContent =
            "Deriv API: " +
            errorMessage;


        console.error(
            "Deriv API error:",
            message.error
        );


        return;

    }


    /*
       ACTIVE SYMBOLS
    */

    if(
        message.msg_type ===
        "active_symbols" ||
        Array.isArray(
            message.active_symbols
        )
    ){

        loadMarkets(
            message.active_symbols || []
        );

        return;

    }


    /*
       HISTORY
    */

    if(
        message.msg_type ===
        "history" ||
        message.history
    ){

        processHistory(
            message.history
        );

        return;

    }


    /*
       LIVE TICK
    */

    if(
        message.msg_type ===
        "tick" ||
        message.tick
    ){

        processLiveTick(
            message
        );

        return;

    }


    /*
       Subscription response
    */

    if(
        message.subscription &&
        message.subscription.id
    ){

        subscriptionId =
            message.subscription.id;

    }

}


/* =========================================================
   LOAD MARKETS
========================================================= */

function loadMarkets(symbols){

    /*
       Current API fields:
       underlying_symbol
       underlying_symbol_name
       underlying_symbol_type
       pip_size
    */

    const normalized =
        symbols
            .map(
                item => {

                    const symbol =
                        item.underlying_symbol ||
                        item.symbol;

                    const name =
                        item.underlying_symbol_name ||
                        item.display_name ||
                        symbol;

                    const type =
                        item.underlying_symbol_type ||
                        item.symbol_type ||
                        "";

                    const pipSize =
                        Number(
                            item.pip_size ||
                            item.pip ||
                            0.01
                        );


                    return {

                        symbol:symbol,

                        name:name,

                        type:type,

                        pip:pipSize,

                        suspended:
                            Number(
                                item.is_trading_suspended
                            ) === 1

                    };

                }
            )
            .filter(
                item =>
                    item.symbol &&
                    !item.suspended
            );


    /*
       Keep digit/synthetic markets.
    */

    marketList =
        normalized.filter(
            item => {

                const text =
                    (
                        item.symbol +
                        " " +
                        item.name +
                        " " +
                        item.type
                    ).toLowerCase();


                return (
                    /^r_/i.test(
                        item.symbol
                    ) ||

                    /^1hz/i.test(
                        item.symbol
                    ) ||

                    text.includes(
                        "volatility"
                    ) ||

                    text.includes(
                        "synthetic"
                    ) ||

                    text.includes(
                        "crash"
                    ) ||

                    text.includes(
                        "boom"
                    ) ||

                    text.includes(
                        "jump"
                    ) ||

                    text.includes(
                        "range break"
                    );

                };

            }
        );


    /*
       Remove duplicates.
    */

    const unique =
        new Map();


    marketList.forEach(
        item => {

            if(
                !unique.has(
                    item.symbol
                )
            ){

                unique.set(
                    item.symbol,
                    item
                );

            }

        }
    );


    marketList =
        Array.from(
            unique.values()
        );


    /*
       If filtering somehow produces nothing,
       use every valid returned symbol.
    */

    if(!marketList.length){

        marketList =
            normalized;

    }


    /*
       Sort by name.
    */

    marketList.sort(
        (a,b) =>
            a.name.localeCompare(
                b.name
            )
    );


    const select =
        $("market");


    select.innerHTML =
        "";


    marketList.forEach(
        item => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                item.symbol;


            option.textContent =
                item.name;


            option.dataset.name =
                item.name;


            option.dataset.pip =
                item.pip;


            select.appendChild(
                option
            );

        }
    );


    if(!marketList.length){

        select.innerHTML =
            '<option value="">No markets returned</option>';

        setConnectionStatus(
            "Connected, but no compatible markets returned"
        );

        return;

    }


    /*
       Prefer Volatility 25.
    */

    const preferred =
        marketList.find(
            item =>
                /volatility 25/i.test(
                    item.name
                )
        );


    const chosen =
        preferred ||
        marketList[0];


    select.value =
        chosen.symbol;


    $("heroMarket").textContent =
        chosen.name;


    pip =
        Number(
            chosen.pip
        ) || 0.01;


    setConnectionStatus(
        "Connected • " +
        marketList.length +
        " markets available"
    );


    /*
       Start analysis.
    */

    startAnalysis();

}


/* =========================================================
   PROCESS HISTORY
========================================================= */

function processHistory(history){

    if(!history){

        return;

    }


    const prices =
        history.prices || [];


    const times =
        history.times || [];


    const parsed = [];


    prices.forEach(
        (price,index) => {

            const tick =
                createTick(
                    price,
                    times[index]
                );


            if(tick){

                parsed.push(
                    tick
                );

            }

        }
    );


    if(!parsed.length){

        $("analysisStatus").textContent =
            "No history received";


        $("message").textContent =
            "Deriv returned no usable historical ticks.";


        return;

    }


    ticks =
        parsed.slice(
            -CONFIG.maxTicks
        );


    /*
       Update latest price.
    */

    const latest =
        ticks[
            ticks.length-1
        ];


    if(latest){

        $("price").textContent =
            latest.price.toFixed(
                decimalPlaces(pip)
            );


        $("lastDigit").textContent =
            latest.digit;

    }


    $("analysisStatus").textContent =
        "Historical data loaded";


    analyze();

}


/* =========================================================
   PROCESS LIVE TICK
========================================================= */

function processLiveTick(message){

    const tick =
        message.tick;


    if(!tick){

        return;

    }


    if(
        tick.pip_size !==
        undefined
    ){

        pip =
            Number(
                tick.pip_size
            ) || pip;

    }


    const parsed =
        createTick(
            tick.quote,
            tick.epoch
        );


    if(!parsed){

        return;

    }


    if(
        message.subscription &&
        message.subscription.id
    ){

        subscriptionId =
            message.subscription.id;

    }


    /*
       Avoid duplicate tick.
    */

    const last =
        ticks[
            ticks.length-1
        ];


    if(
        last &&
        last.epoch ===
        parsed.epoch
    ){

        return;

    }


    ticks.push(
        parsed
    );


    if(
        ticks.length >
        CONFIG.maxTicks
    ){

        ticks.shift();

    }


    $("price").textContent =
        parsed.price.toFixed(
            decimalPlaces(pip)
        );


    $("lastDigit").textContent =
        parsed.digit;


    analyze();

}


/* =========================================================
   START ANALYSIS
========================================================= */

function startAnalysis(){

    if(!connected){

        connect();

        return;

    }


    const symbol =
        $("market").value;


    if(!symbol){

        return;

    }


    analyzing =
        true;


    ticks = [];


    const option =
        $("market").options[
            $("market").selectedIndex
        ];


    pip =
        Number(
            option?.dataset.pip
        ) || 0.01;


    $("heroMarket").textContent =
        option?.dataset.name ||
        symbol;


    /*
       Stop previous subscription.
    */

    if(subscriptionId){

        send({

            forget:
                subscriptionId

        });


        subscriptionId =
            null;

    }


    /*
       We need:

       analysis history
       +
       contract duration
       +
       extra buffer

       Example:

       1000 analysis ticks
       + 1000 duration
       + 50 buffer

       = 2050 ticks

       This makes horizon analysis possible.
    */

    const analysisCount =
        Number(
            $("analysisTicks").value
        ) || 1000;


    const duration =
        Number(
            $("duration").value
        ) || 100;


    const count =
        Math.min(
            CONFIG.maxTicks,
            Math.max(
                300,
                analysisCount +
                duration +
                50
            )
        );


    $("analysisStatus").textContent =
        "Loading " +
        count +
        " ticks...";


    /*
       Historical data.
    */

    send({

        ticks_history:
            symbol,

        count:
            count,

        end:
            "latest",

        style:
            "ticks",

        req_id:
            requestId++

    });


    /*
       Live data.
    */

    send({

        ticks:
            symbol,

        subscribe:
            1,

        req_id:
            requestId++

    });


    analyze();

}


/* =========================================================
   STOP
========================================================= */

function stopAnalysis(){

    analyzing =

    if(subscriptionId){

        send({

            forget:

    subscriptionId =

    $("analysisStatus").textContent =

    $("message").textContent =

    resetAnalysisDisplay();

    drawCharts();

}

        if(ws){

            ws.close();

        }


        showModal(
            "Disconnected",
            `
            <p>
                The public Deriv market-data connection
                has been closed.
            </p>

            <button
                class="btn green"
                id="reconnectModal"
            >
                Reconnect
            </button>
            `
        );


        setTimeout(
            function(){

                const button =
                    $("reconnectModal");

                if(button){

                    button.onclick =
                        function(){

                            $("modal")
                                .classList
                                .remove(
                                    "show"
                                );

                            manualDisconnect =
                                false;

                            connect();

                        };

                }

            },
            0
        );

    };


/* =========================================================
   MODAL CLOSE
========================================================= */

$("close").onclick =
    function(){

        $("modal")
            .classList
            .remove(
                "show"
            );

    };


/* =========================================================
   THEME
========================================================= */

$("theme").onchange =
    function(event){

        if(event.target.checked){

            document.body.style.filter =
                "brightness(.92) saturate(.9)";

        }

        else{

            document.body.style.filter =
                "none";

        }

    };


/* =========================================================
   AUTO ANALYSIS
========================================================= */

function setupAutoAnalysis(){

    clearInterval(
        autoTimer
    );


    if(
        $("auto").checked
    ){

        autoTimer =
            setInterval(
                function(){

                    if(
                        connected &&
                        analyzing
                    ){

                        startAnalysis();

                    }

                },
                30000
            );

    }

}


$("auto").onchange =
    function(){

        setupAutoAnalysis();

        toast(
            $("auto").checked
            ? "Auto analysis enabled"
            : "Auto analysis disabled"
        );

    };


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    function(){

        drawCharts();

    }
);


/* =========================================================
   INITIAL UI
========================================================= */

setContract(
    "OVER"
);

$("barrier").value =
    barrierValue;

updateBarrierButtons();

setupAutoAnalysis();

connect();

</script>
